
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI IT Support Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #f1f5f9;
            color: #1e293b;
        }

        .chat-container {
            max-width: 700px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 20px;
        }

        .status {
            text-align: center;
            color: #16a34a;
            font-size: 14px;
            margin-bottom: 15px;
        }

        #chat-box {
            height: 380px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            background: #f8fafc;
            margin-bottom: 15px;
        }

        .message {
            padding: 11px 14px;
            margin: 10px 0;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .user {
            background: #2563eb;
            color: white;
            margin-left: auto;
        }

        .bot {
            background: #e2e8f0;
            color: #1e293b;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .chat-container {
                padding: 15px;
            }

            .input-area {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <h1>🤖 IT Support Assistant</h1>

        <p class="subtitle">
            Your AI-powered assistant for common IT problems.
        </p>

        <div class="status">
            ● Support Assistant Available
        </div>

        <div id="chat-box" aria-live="polite">

            <div class="message bot">
                Hello! Welcome to IT Support.
                How can I help you today?
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Describe your IT problem..."
                autocomplete="off"
            >

            <button id="send-button" onclick="sendMessage()">
                Send
            </button>

        </div>

        <a href="/" class="back-link">
            ← Back to Dashboard
        </a>

    </div>

    <script>

        async function sendMessage() {

            const input = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const sendButton = document.getElementById("send-button");

            const message = input.value.trim();

            if (message === "") {
                return;
            }

            // Display user message safely
            const userMessage = document.createElement("div");
            userMessage.className = "message user";
            userMessage.textContent = message;

            chatBox.appendChild(userMessage);

            input.value = "";
            sendButton.disabled = true;
            sendButton.textContent = "Sending...";

            chatBox.scrollTop = chatBox.scrollHeight;

            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                });

                if (!response.ok) {
                    throw new Error("Server error");
                }

                const data = await response.json();

                const botMessage = document.createElement("div");
                botMessage.className = "message bot";
                botMessage.textContent =
                    data.reply || "Sorry, I could not generate a response.";

                chatBox.appendChild(botMessage);

            } catch (error) {

                const errorMessage = document.createElement("div");
                errorMessage.className = "message bot";
                errorMessage.textContent =
                    "Sorry, something went wrong. Please try again.";

                chatBox.appendChild(errorMessage);

                console.error(error);

            } finally {

                sendButton.disabled = false;
                sendButton.textContent = "Send";

                chatBox.scrollTop = chatBox.scrollHeight;
                input.focus();

            }

        }

        // Send message using Enter key
        document.getElementById("user-input")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    sendMessage();
                }

            });

    </script>

</body>
</html>
